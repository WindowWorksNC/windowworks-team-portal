<body>
<div class="header">
  <a class="logo" href="index.html">Window <span>Works</span> Co.</a>
  <div class="header-right">
    <a class="back-link" href="javascript:history.back()">&#8592; Back</a>
    <div class="header-tag">Team Portal</div>
  </div>
</div>
<div class="orange-bar"></div>

<div class="body">
  <div class="page-title">Company Resources</div>
  <div class="page-sub">Payroll dates and company holidays for Window Works Co.</div>

  <div class="card">
    <div class="card-title">
      Payroll Schedule
      <select class="year-sel" id="year-sel" onchange="renderPayroll()">
        <option value="2026">2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
      </select>
    </div>
    <div id="next-pay-wrap"></div>
    <div style="overflow-x:auto">
      <table class="data-table payroll-table">
        <thead><tr><th style="text-align:left">#</th><th style="text-align:left">Pay Period</th><th style="text-align:left">Due Date</th><th style="text-align:left">Pay Date</th></tr></thead>
        <tbody id="payroll-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      Company Paid Holidays
      <select class="year-sel" id="hol-yr" onchange="renderHolidays()">
        <option value="2026">2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
      </select>
    </div>
    <div id="holidays-body"></div>
  </div>
</div>

<div class="footer">
  <div class="footer-l">Window Works Co. &nbsp;&bull;&nbsp; windowworksnc.com</div>
  <div class="footer-r">(919) 854-6121</div>
</div>
