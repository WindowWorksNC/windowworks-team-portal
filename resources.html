<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=167">
<link rel="manifest" href="site.webmanifest?v=167">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Window Works">
<title>Company Resources | Window Works Team Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=167">
</head>
<body>
<div class="header">
  <a class="logo" href="index.html">Window <span>Works</span> Co.</a>
  <div class="header-right">
    <a class="back-link" href="javascript:history.back()">&#8592; Back</a>
    <div class="header-tag">Team Portal</div>
  </div>
</div>
<div class="orange-bar"></div>

<div class="body">
  <div class="page-title">Company Resources</div>
  <div class="page-sub">Payroll dates and company holidays for Window Works Co.</div>

  <div class="card">
    <div class="card-title">
      Payroll Schedule
      <select class="year-sel" id="year-sel" onchange="renderPayroll()">
        <option value="2026">2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
      </select>
    </div>
    <div id="next-pay-wrap"></div>
    <div style="overflow-x:auto">
      <table class="data-table payroll-table">
        <thead><tr><th style="text-align:left">#</th><th style="text-align:left">Pay Period</th><th style="text-align:left">Due Date</th><th style="text-align:left">Pay Date</th></tr></thead>
        <tbody id="payroll-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      Company Paid Holidays
      <select class="year-sel" id="hol-yr" onchange="renderHolidays()">
        <option value="2026">2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
      </select>
    </div>
    <div id="holidays-body"></div>
  </div>
</div>

<div class="footer">
  <div class="footer-l">Window Works Co. &nbsp;&bull;&nbsp; windowworksnc.com</div>
  <div class="footer-r">(919) 854-6121</div>
</div>

<script src="resources.js?v=167"></script>
<script>
(function(){
  var el=document.querySelector('link[href*="portal.css?v="]')||document.querySelector('script[src*="gate.js?v="]')||document.querySelector('link[href*="?v="]')||document.querySelector('script[src*="?v="]');
  var ver='';
  if(el){var m=(el.getAttribute('href')||el.getAttribute('src')||'').match(/v=(\d+)/);if(m)ver=m[1];}
  var b=document.createElement('div');
  b.textContent='v'+(ver||'?');
  b.title='Deployed portal build';
  b.style.cssText='position:fixed;bottom:8px;right:10px;font-family:Barlow,Arial,sans-serif;font-size:11px;font-weight:600;color:#999;background:rgba(245,237,224,0.92);border:1px solid #e0d8c8;padding:2px 8px;border-radius:10px;z-index:99999;pointer-events:none';
  document.body.appendChild(b);
})();
</script>
</body>
</html>
